name: Deploy NovaKargo to AWS Elastic Beanstalk

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Repoyu Klonla
        uses: actions/checkout@v3

      - name: 2. Java 21 Ortamını Kur
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Maven ile Build Al (.jar üret)
        run: ./mvnw clean package -DskipTests

      - name: 4. Deployment İçin ZIP Oluştur
        run: |
          cp target/*.jar application.jar
          zip deploy.zip application.jar

      - name: 5. AWS Elastic Beanstalk'a Yükle
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: NovaKargo
          environment_name: NovaKargo-env
          version_label: "novakargo-deploy-${{ github.run_number }}"
          region: eu-north-1
          deployment_package: deploy.zip