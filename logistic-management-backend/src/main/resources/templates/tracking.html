<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Kargo Takip - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/tracking.css" rel="stylesheet">
</head>
<body>
<header class="tracking-header">
    <h1 class="fw-bold">Kargonuzu Takip Edin</h1>
    <p class="opacity-75">Takip numaranızı girerek güncel durumu öğrenin.</p>
</header>

<div class="container">
    <div class="search-box">
        <input type="text" placeholder="TR-XXXXXX">
        <button class="btn-track">SORGULA</button>
    </div>

    <div class="card border-0 shadow-sm p-5 rounded-4 mb-5">
        <h4 class="fw-bold mb-4">Gönderi Detayları</h4>
        <div class="timeline">
            <div class="timeline-item done">
                <div class="timeline-dot"></div>
                <h6 class="fw-bold mb-1">Kargo Kabul Edildi</h6>
                <p class="text-muted small">Kayseri Şube - 14.04.2026 09:00</p>
            </div>
            <div class="timeline-item">
                <div class="timeline-dot"></div>
                <h6 class="fw-bold mb-1">Yolda</h6>
                <p class="text-muted small">Transfer Merkezi - Bekleniyor</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
