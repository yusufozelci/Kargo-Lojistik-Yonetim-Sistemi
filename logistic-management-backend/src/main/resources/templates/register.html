<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - KargoSync Kurumsal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand-logo">
            <i class="fa-solid fa-truck-fast text-primary me-2"></i>Kargo<span>Sync</span>
        </div>
        <div class="auth-subtitle">Kurumsal lojistik ağına katılın</div>

        <form th:action="@{/register}" th:object="${UserRegisterDto}" method="post">
            <div class="mb-3">
                <label class="form-label">Ad Soyad</label>
                <input type="text" class="form-control" th:field="*{fullName}" placeholder="Örn: Ahmet Yılmaz" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-posta Adresi</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="sirket@ornek.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Şifre</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-corp">
                <i class="fa-solid fa-user-plus me-2"></i>Kayıt İşlemini Tamamla
            </button>
        </form>

        <div class="auth-footer text-center mt-3" style="font-size: 0.9rem;">
            Zaten bir hesabınız var mı? <a th:href="@{/login}">Giriş Yapın</a>
        </div>
    </div>
</div>
</body>
</html>
