<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NovaKargo | Kayıt Ol</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a th:href="@{/}" class="brand">
            <div class="brand-icon"><span class="box-top"></span><span class="box-side"></span></div>
            <strong>Nova<span>Kargo</span></strong>
        </a>

        <nav class="main-nav">
            <a th:href="@{/}">Ana Sayfa</a>
            <a th:href="@{/#tracking}">Kargo Takip</a>
            <a th:href="@{/#pricing}">Ücret Hesaplama</a>
            <a th:href="@{/login}">Giriş Yap</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-form-container">
        <div class="auth-card">
            <h1>Kayıt Ol</h1>
            <p style="color: var(--muted); margin-bottom: 24px;">NovaKargo sistemine yeni müşteri hesabı oluşturun.</p>

            <form th:action="@{/register}" th:object="${UserRegisterDto}" method="post">
                <div class="input-group">
                    <label for="fullName">Ad Soyad</label>
                    <input type="text" id="fullName" th:field="*{fullName}" placeholder="Örn: Emirhan Uraş" required>
                    <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
                </div>

                <div class="input-group">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="ornek@mail.com" required>
                    <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                </div>

                <div class="input-group">
                    <label for="phone">Telefon</label>
                    <input type="tel" id="phone" th:field="*{phone}" placeholder="5551234567" required>
                    <small class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
                </div>

                <div class="input-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="En az 6 karakter" required>
                    <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                </div>

                <button type="submit" class="primary-button">Hesap Oluştur</button>

                <p class="helper-text" style="margin-top: 16px; text-align: center;">
                    Zaten hesabınız var mı?
                    <a th:href="@{/login}" style="color: var(--orange); font-weight: bold; text-decoration: none;">Giriş yapın</a>
                </p>
            </form>
        </div>
    </section>
</main>

</body>
</html>
