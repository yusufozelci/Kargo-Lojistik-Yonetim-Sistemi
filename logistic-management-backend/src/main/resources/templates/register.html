<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Kayıt Ol - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet">
</head>
<body>
<div class="auth-card" style="max-width: 450px;">
    <div class="auth-header">
        <h3>Yeni Hesap Oluştur</h3>
        <p class="text-muted small">Ağa katılmak için bilgilerinizi girin</p>
    </div>
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label">Ad Soyad</label>
            <input type="text" class="form-control" name="fullName" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-posta Adresi</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Şifre</label>
            <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn-corp">Kayıt İşlemini Tamamla</button>
    </form>
    <div class="mt-4 text-center small">
        <a href="login.html" class="text-decoration-none fw-bold">Zaten bir hesabım var</a>
    </div>
</div>
</body>
</html>
