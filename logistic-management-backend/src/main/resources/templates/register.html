<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KargoSync - Küresel Lojistik - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid registration-container px-0">
    <div class="row g-0 h-100 w-100">
        <div class="col-lg-6 branding-section">
            <div class="logo-box">
                <i class="fas fa-shipping-fast text-white"></i>
            </div>
            <h1>KargoSync</h1>
            <p class="lead text-center px-4">Küresel Lojistik Çözümleri, Yerel Dokunuş</p>
            <p class="text-center text-white-50 mt-3">Hemen kayıt olun ve kargo süreçlerinizi profesyonel bir şekilde yönetmeye başlayın. Güvenli ve hızlı takibin adresi.</p>
        </div>

        <div class="col-lg-6 col-12 form-section bg-white">
            <div class="text-center mb-5">
                <h2 class="fw-extrabold" style="color: var(--primary-color); font-weight: 800;">Yeni Hesap Oluştur</h2>
                <p class="text-muted">Kargo takibi ve yönetimi için ilk adımı atın.</p>
            </div>

            <form th:action="@{/register}" method="post">

                <div class="mb-4 form-floating position-relative">
                    <i class="fas fa-user input-group-icon"></i>
                    <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Ad Soyad" required>
                    <label for="fullName">Ad Soyad</label>
                </div>

                <div class="mb-4 form-floating position-relative">
                    <i class="fas fa-envelope input-group-icon"></i>
                    <input type="email" class="form-control" id="email" name="email" placeholder="E-posta" required>
                    <label for="email">E-posta Adresi</label>
                </div>

                <div class="mb-4 form-floating position-relative">
                    <i class="fas fa-phone-alt input-group-icon"></i>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="Telefon">
                    <label for="phone">Telefon Numarası</label>
                </div>

                <div class="mb-4 form-floating position-relative">
                    <i class="fas fa-lock input-group-icon"></i>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Şifre" required>
                    <label for="password">Şifre</label>
                </div>

                <div class="mb-5 form-floating position-relative">
                    <i class="fas fa-lock-open input-group-icon"></i>
                    <input type="password" class="form-control" id="passwordConfirm" placeholder="Şifre Tekrar" required>
                    <label for="passwordConfirm">Şifre Tekrar</label>
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-register">Kayıt Ol</button>
                </div>
            </form>

            <div class="text-center">
                <p>Zaten hesabınız var mı? <a th:href="@{/login}" class="link-login">Giriş Yapın</a></p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
