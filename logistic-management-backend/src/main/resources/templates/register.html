<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Düğüm Kaydı - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet">
</head>
<body>

<div class="auth-glass-panel">
    <div class="text-center mb-4">
        <i class="fas fa-network-wired" style="font-size: 2.5rem; color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);"></i>
    </div>
    <h3 class="glow-text">NODE.REGISTER //</h3>

    <form th:action="@{/register}" method="post">
        <div class="cyber-input-group">
            <i class="fas fa-user"></i>
            <input type="text" class="cyber-input" name="fullName" placeholder="Kullanıcı Adı" required>
        </div>

        <div class="cyber-input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" class="cyber-input" name="email" placeholder="İletişim Kanalı (E-posta)" required>
        </div>

        <div class="cyber-input-group">
            <i class="fas fa-phone-alt"></i>
            <input type="tel" class="cyber-input" name="phone" placeholder="Telefon Numarası">
        </div>

        <div class="cyber-input-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="cyber-input" name="password" placeholder="Şifre" required>
        </div>

        <button type="submit" class="btn-cyber">Kayıt Ol</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
        <a href="login.html" class="cyber-link"><i class="fas fa-arrow-left me-2"></i>Giriş Sayfasına Dön</a>
    </div>
</div>

</body>
</html>
