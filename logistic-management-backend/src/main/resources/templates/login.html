<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/auth.css}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand-logo">
            <i class="fa-solid fa-truck-fast text-primary me-2"></i>Kargo<span>Sync</span>
        </div>
        <div class="auth-subtitle">Yönetim paneline hoş geldiniz</div>

        <div th:if="${param.error}" class="alert alert-danger py-2 text-center" style="font-size: 0.9rem;">
            Hatalı e-posta veya şifre girdiniz.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">E-posta Adresi</label>
                <input type="email" name="username" class="form-control" placeholder="E-posta adresiniz" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-corp"><i class="fa-solid fa-right-to-bracket me-2"></i>Giriş Yap</button>
        </form>

        <div class="auth-footer text-center mt-3" style="font-size: 0.9rem;">
            Henüz üye değil misiniz? <a th:href="@{/register}">Hesap Oluşturun</a>
        </div>
    </div>
</div>
</body>
</html>
