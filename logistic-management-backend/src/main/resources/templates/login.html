<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Giriş Yap - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet">
</head>
<body>
<div class="auth-card">
    <div class="auth-header">
        <h3>KargoSync</h3>
        <p class="text-muted small">Lojistik Yönetim Paneline Erişin</p>
    </div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">E-posta</label>
            <input type="email" class="form-control" name="username" placeholder="ad@kurum.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Şifre</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-corp">Giriş Yap</button>
    </form>
    <div class="mt-4 text-center small">
        <span class="text-muted">Hesabınız yok mu?</span> <a href="register.html" class="text-decoration-none fw-bold">Kaydolun</a>
    </div>
</div>
</body>
</html>
