<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Erişimi - KargoSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../static/css/auth.css" rel="stylesheet">
</head>
<body>

<div class="auth-glass-panel">
    <div class="text-center mb-4">
        <i class="fas fa-radar" style="font-size: 2.5rem; color: var(--neon-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);"></i>
    </div>
    <h3 class="glow-text">SYS.LOGIN //</h3>

    <form th:action="@{/login}" method="post">
        <div class="cyber-input-group">
            <i class="fas fa-terminal"></i>
            <input type="email" class="cyber-input" name="username" placeholder="Sistem ID (E-posta)" required>
        </div>

        <div class="cyber-input-group">
            <i class="fas fa-key"></i>
            <input type="password" class="cyber-input" name="password" placeholder="Şifre" required>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" style="background-color: transparent; border-color: var(--border-color);">
                <label class="form-check-label cyber-link" for="rememberMe">Bağlantıyı Koru</label>
            </div>
            <a href="#" class="cyber-link">Anahtarı Yenile</a>
        </div>

        <button type="submit" class="btn-cyber">Giriş Yap</button>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
        <a href="register.html" class="cyber-link"><i class="fas fa-plug me-2"></i>Hesabınız yok mu? -> Kayıt Ol</a>
    </div>
</div>

</body>
</html>
