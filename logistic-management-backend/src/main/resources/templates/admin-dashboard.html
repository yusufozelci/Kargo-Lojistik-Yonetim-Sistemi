<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Workspace - KargoSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>


<header class="topbar">
    <div class="brand"><i class="fa-solid fa-layer-group"></i> KargoSync Workspace</div>

    <div class="nav-links">
        <button class="nav-btn active">Operasyon Merkezi</button>
        <button class="nav-btn">Müşteri Ağı</button>
        <button class="nav-btn">Lojistik Rotaları</button>
    </div>

    <div>
        <form th:action="@{/logout}" method="post" style="margin: 0;">
            <button type="submit" class="nav-btn" style="color: #ef4444;"><i class="fa-solid fa-power-off"></i> Çıkış</button>
        </form>
    </div>
</header>


<main class="main-container">


    <div class="panel-card">
        <div class="panel-title">Canlı Operasyon Özeti <span style="font-size: 0.8rem; color: #6b7280; font-weight: 400;">(Son 24 Saat)</span></div>

        <div class="stats-row">
            <div class="micro-stat">
                <h4>Bekleyen / İşlemde</h4>
                <h2 id="stat-pending">-</h2>
            </div>
            <div class="micro-stat" style="border-color: #e0e7ff;">
                <h4>Aktif Dağıtımda</h4>
                <h2 id="stat-transit" style="color: #4338ca;">-</h2>
            </div>
        </div>

        <h3 style="font-size: 1rem; margin-bottom: 15px; color: var(--text-gray);">Son Eklenen Gönderiler</h3>
        <div class="list-wrapper" id="shipment-list">
            <div style="text-align: center; color: #9ca3af; padding: 20px;">Veriler yükleniyor...</div>
        </div>
    </div>


    <div class="panel-card" style="background: #fafafa;">
        <div class="panel-title" style="color: var(--primary);">Hızlı Gönderi Oluştur</div>

        <form id="quickShipmentForm" style="display: flex; flex-direction: column; height: 100%;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>Gönderici Müşteri</label>
                    <select id="senderId" class="clean-input" required>
                        <option value="" disabled selected>Müşteriler Yükleniyor...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Alıcı Müşteri</label>
                    <select id="receiverId" class="clean-input" required>
                        <option value="" disabled selected>Müşteriler Yükleniyor...</option>
                    </select>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>Çıkış Adresi</label>
                    <select id="originId" class="clean-input" required>
                        <option value="" disabled selected>Adresler Yükleniyor...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Varış Adresi</label>
                    <select id="destId" class="clean-input" required>
                        <option value="" disabled selected>Adresler Yükleniyor...</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Ağırlık (kg)</label>
                <input type="number" step="0.1" id="weight" class="clean-input" required placeholder="0.0">
            </div>

            <div class="input-group">
                <label>Mesafe (km)</label>
                <input type="number" step="0.1" id="distance" class="clean-input" required placeholder="0.0">
            </div>

            <div style="margin-top: auto;">
                <div id="form-alert" style="text-align: center; margin-bottom: 15px; font-weight: 500; font-size: 0.9rem;"></div>
                <button type="submit" class="btn-primary"><i class="fa-solid fa-paper-plane me-2"></i> Kargoyu Sisteme İşle</button>
            </div>
        </form>

    </div>
</main>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
